# HTTP (entrypoint web) → HTTPS for /travel only.
#
# Diagnosis (iOS Safari):
#   http://tool4speak.com/travel → Traefik default
#     Content-Type: text/plain; charset=utf-8
#     body: "404 page not found\n" (19 bytes)
#   Safari names that download travel.txt.
# HTTPS /travel/ was already correct; Ingress was websecure-only.
#
# Same pattern as buensoftware/falcon redirectScheme middleware.
# Does not change Basic Auth on websecure. Does not touch Tool4Speak /.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: viajes
  labels:
    app: viajes-web
spec:
  redirectScheme:
    permanent: true
    scheme: https
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: viajes-web-http
  namespace: viajes
  labels:
    app: viajes-web
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: viajes-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: tool4speak.com
      http:
        paths:
          - path: /travel
            pathType: Prefix
            backend:
              service:
                name: viajes-web
                port:
                  number: 80
    - host: www.tool4speak.com
      http:
        paths:
          - path: /travel
            pathType: Prefix
            backend:
              service:
                name: viajes-web
                port:
                  number: 80
