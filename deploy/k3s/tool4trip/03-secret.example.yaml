# Secret tool4trip-session-auth — crear fuera de Git (copiar desde viajes o script).
#
# kubectl -n viajes get secret viajes-session-auth -o yaml \
#   | sed 's/namespace: viajes/namespace: tool4trip/' \
#   | sed 's/name: viajes-session-auth/name: tool4trip-session-auth/' \
#   | kubectl apply -f -
#
# Keys: AUTH_USERNAME, AUTH_PASSWORD_HASH, SESSION_SECRET
apiVersion: v1
kind: Secret
metadata:
  name: tool4trip-session-auth-PLACEHOLDER
  namespace: tool4trip
type: Opaque
stringData:
  AUTH_USERNAME: "REPLACE"
  AUTH_PASSWORD_HASH: "REPLACE"
  SESSION_SECRET: "REPLACE_WITH_OPENSSL_RAND_BASE64_48"
