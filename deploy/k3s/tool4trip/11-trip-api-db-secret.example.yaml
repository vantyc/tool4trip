# Example secret — do not commit real passwords.
# Prefer: scripts/create-trip-api-db-secret.sh
apiVersion: v1
kind: Secret
metadata:
  name: trip-api-db
  namespace: tool4trip
type: Opaque
stringData:
  POSTGRES_USER: trip
  POSTGRES_PASSWORD: CHANGE_ME
  POSTGRES_DB: tool4trip
  DATABASE_URL: postgres://trip:CHANGE_ME@postgres:5432/tool4trip
