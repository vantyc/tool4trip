apiVersion: apps/v1
kind: Deployment
metadata:
  name: travel-agent
  namespace: tool4trip
  labels:
    app: travel-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: travel-agent
  template:
    metadata:
      labels:
        app: travel-agent
    spec:
      imagePullSecrets:
        - name: ghcr-registry
      containers:
        - name: travel-agent
          image: ghcr.io/vantyc/travel-agent:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LISTEN_ADDR
              value: ":8080"
            - name: ENABLE_WEB_TOOLS
              value: "1"
            - name: WEB_SEARCH_PROVIDER
              value: "tavily"
            - name: ENABLE_DDG_FALLBACK
              value: "0"
            - name: LLM_PROVIDER
              value: "openai-compatible"
            - name: LLM_BASE_URL
              value: "https://api.openai.com/v1"
            - name: LLM_MODEL
              value: "gpt-4.1-mini"
            - name: LLM_MAX_TOKENS
              value: "8192"
            - name: AGENT_MAX_TOOL_CALLS
              value: "6"
            - name: AGENT_MAX_STEPS
              value: "8"
            - name: LLM_TIMEOUT_MS
              value: "180000"
            - name: AGENT_JOB_MAX_CONCURRENCY
              value: "1"
            - name: AGENT_JOB_TTL_MS
              value: "2700000"
            - name: AGENT_JOB_MAX_JOBS
              value: "50"
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: travel-agent-llm
                  key: LLM_API_KEY
                  optional: true
            - name: TAVILY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: travel-agent-llm
                  key: TAVILY_API_KEY
                  optional: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: travel-agent
  namespace: tool4trip
  labels:
    app: travel-agent
spec:
  selector:
    app: travel-agent
  ports:
    - name: http
      port: 8080
      targetPort: http
