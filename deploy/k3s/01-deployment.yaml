apiVersion: apps/v1
kind: Deployment
metadata:
  name: viajes-web
  namespace: viajes
  labels:
    app: viajes-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: viajes-web
  template:
    metadata:
      labels:
        app: viajes-web
    spec:
      imagePullSecrets:
        - name: ghcr-registry
      containers:
        - name: viajes-web
          image: ghcr.io/vantyc/viajes:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /travel/
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /travel/
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
