<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1a3a4a" />
    <title>Viajes — Acceso</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #e8eef1;
        --ink: #1a3a4a;
        --card: #f7fafb;
        --line: #c5d2d8;
        --accent: #1a3a4a;
        --err: #8b2e2e;
        --err-bg: #f8eaea;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        font-family: "Segoe UI", system-ui, sans-serif;
        background:
          radial-gradient(1200px 600px at 10% -10%, #d5e4ea 0%, transparent 55%),
          radial-gradient(900px 500px at 100% 0%, #cfd9c8 0%, transparent 50%),
          var(--bg);
        color: var(--ink);
        display: grid;
        place-items: center;
        padding: 1.5rem;
      }
      main {
        width: min(100%, 22rem);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 1.5rem 1.25rem 1.25rem;
        box-shadow: 0 10px 30px rgba(26, 58, 74, 0.08);
      }
      h1 {
        margin: 0 0 0.25rem;
        font-size: 1.35rem;
        letter-spacing: 0.02em;
      }
      p.lead {
        margin: 0 0 1.25rem;
        font-size: 0.92rem;
        opacity: 0.8;
      }
      label {
        display: block;
        font-size: 0.8rem;
        font-weight: 600;
        margin: 0.75rem 0 0.35rem;
      }
      input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 0.7rem 0.75rem;
        font-size: 1rem;
        background: #fff;
        color: var(--ink);
      }
      input:focus {
        outline: 2px solid rgba(26, 58, 74, 0.35);
        outline-offset: 1px;
      }
      button {
        margin-top: 1.25rem;
        width: 100%;
        border: 0;
        border-radius: 8px;
        padding: 0.8rem 1rem;
        font-size: 1rem;
        font-weight: 600;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
      }
      button:active {
        transform: translateY(1px);
      }
      .error {
        margin: 0 0 1rem;
        padding: 0.65rem 0.75rem;
        border-radius: 8px;
        background: var(--err-bg);
        color: var(--err);
        font-size: 0.88rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Tool4Trip</h1>
      <p class="lead">Acceso privado</p>
      {{ERROR}}
      <form method="post" action="/api/login" autocomplete="username">
        <label for="username">Usuario</label>
        <input
          id="username"
          name="username"
          type="text"
          required
          autofocus
          autocomplete="username"
          autocapitalize="none"
          spellcheck="false"
          value="{{USERNAME}}"
        />
        <label for="password">Contraseña</label>
        <input
          id="password"
          name="password"
          type="password"
          required
          autocomplete="current-password"
        />
        <button type="submit">Entrar</button>
      </form>
    </main>
  </body>
</html>
