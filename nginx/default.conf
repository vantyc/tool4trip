server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Behind Traefik TLS termination $scheme is http; keep Location relative.
    absolute_redirect off;

    # Canonical trailing slash for the app root
    location = /travel {
        return 301 /travel/;
    }

    # SPA under /travel/ (Vite base). Full path preserved from Traefik — no StripPrefix.
    location /travel/ {
        try_files $uri $uri/ /travel/index.html;
    }

    location = /travel/index.html {
        add_header Cache-Control "no-cache";
    }

    location = /travel/sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* ^/travel/workbox-.*\.js$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /travel/manifest.webmanifest {
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location /travel/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* ^/travel/.*\.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Anything outside /travel/ is not this app
    location / {
        return 404;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;
}
